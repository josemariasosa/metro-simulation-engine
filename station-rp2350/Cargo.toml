[package]
name = "station-rp2350"
version = "0.1.0"
edition = "2024"

[dependencies]
nrf24-driver = { path = "../nrf24-driver" }
le-rove-protocol = { path = "../le-rove-protocol" }
embedded-hal-bus = "0.3"
rp235x-hal = { version = "0.4.0", features = ["rt", "critical-section-impl"] }
embedded-hal = "1.0.0"
cortex-m = "0.7.9"
cortex-m-rt = "0.7.7"
usb-device = "0.3.2"
usbd-serial = "0.2.2"
heapless = "0.9.3"

[workspace]
resolver = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
